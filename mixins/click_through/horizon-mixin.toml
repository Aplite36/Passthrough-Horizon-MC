[mod]
id = "click_through"
version = "0.1.0"
priority = 100

# The Horizon commit it was tested on. It uses named hook points and the game's
# helpers only, so the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "1453e0e614af4b2d04dd0d228a94162b5d459910"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "click_through"
source = "runtime.rs"

# The use key, before the game acts on the crosshair: the click this mod redirects.
[[injection]]
id = "use_key"
kind = "HEAD"
hook = "interaction_key"
hook_version = 1
helper = "use_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "i32", value = "button" },
  { name = "hand", ty = "horizon_client::first_person::Hand", value = "hand" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# The server's packets: which item frames and paintings exist, and which way they face.
[[injection]]
id = "packet"
kind = "HEAD"
hook = "client_packet"
hook_version = 1
helper = "packet.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "packet", ty = "&horizon_client::mod_api::ClientboundPlayPacket", value = "packet" },
]

# The sneak key, once a tick: a sneaked click is left alone.
[[injection]]
id = "input"
kind = "HEAD"
hook = "movement_input"
hook_version = 1
helper = "input.rs"
bindings = [
  { name = "sneak", ty = "bool", value = "*sneak" },
]

[[injection]]
id = "list"
kind = "HEAD"
hook = "mods"
hook_version = 1
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
hook = "settings"
hook_version = 1
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
hook = "settings_click"
hook_version = 1
helper = "click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
